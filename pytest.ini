[pytest]
minversion = 9.0
testpaths = tests
pythonpath = .
bdd_features_base_dir = features/
addopts =
    -ra
    --strict-markers
    --strict-config
    --alluredir=reports/allure-results
# Los tags @tc-*, @known-bug y @bug:* se traducen en support/bdd_tags.py (pytest_bdd_apply_tag).
markers =
    smoke: pruebas críticas y rápidas
    regression: suite completa de regresión
    negative: casos negativos
    unit: pruebas unitarias del framework (sin red)
    contrato: valida el contrato JSON Schema de la respuesta
    requiere_key: necesita REQRES_API_KEY (skip en local sin key; fallo en CI)
    tc(id): identificador del caso de prueba (desde el tag @tc-*)
    known_bug: bug conocido del sistema bajo prueba (desde @known-bug, se ejecuta como xfail strict)
    bug(id): identificador del bug conocido (desde el tag @bug:<ID>)
    allure_label: etiqueta de Allure (registrada también sin --alluredir)
    reqres: escenarios de la API de ReqRes
    usuarios: recurso /users de ReqRes
    robustez: robustez ante peticiones inválidas o lentas
    autenticacion: registro e inicio de sesión
    seguridad: autenticación de la API y control de acceso
    rendimiento: tiempos de respuesta frente a umbrales del YAML
    booker: escenarios de la API restful-booker
    reservas: recurso /booking de restful-booker
